[project]
name = "api-server"
version = "0.1.0"
description = "New Server to use Digital Curling"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiosqlite==0.21.0",
    "apscheduler==3.11.0",
    "asyncpg==0.30.0",
    "fastapi[all,standard]==0.115.5",
    "gunicorn==23.0.0",
    "numpy==1.26.4",
    "psycopg-pool==3.2.0",
    "psycopg[binary]==3.1.20",
    "python-dotenv==1.0.1",
    "redis==6.0.0",
    "requests==2.32.3",
    "sqlalchemy==2.0.36",
    "sse-starlette==1.8.2",
    "uuid6==2024.7.10",
    "uvicorn[standard]==0.32.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.2",
]
